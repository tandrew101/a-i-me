            const cfg = r.status==="complete"
              ? {bg:"#0f2a1a",border:"#16a34a",badge:"#86efac",label:"✅ Complete"}
              : r.status==="current"
              ? {bg:"#0f1f40",border:"#3b82f6",badge:"#93c5fd",label:"🔧 In progress"}
              : r.status==="upcoming"
              ? {bg:"#1e1040",border:"#7c3aed",badge:"#c4b5fd",label:"⬜ Upcoming"}
              : {bg:"#161b22",border:"#21262d",badge:"#475569",label:"⬜ Future"};
            return (
              <div key={r.phase} style={{background:cfg.bg,border:`1px solid ${cfg.border}44`,borderLeft:`3px solid ${r.color}`,borderRadius:10,padding:"14px 16px",marginBottom:12}}>
                <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:6}}>
                  <span style={{background:"#0d1117",color:r.color,border:`1px solid ${r.color}44`,fontSize:11,fontWeight:700,padding:"2px 9px",borderRadius:4}}>Phase {r.phase}</span>
                  <span style={{fontWeight:700,fontSize:14}}>{r.name}</span>
                  <span style={{color:cfg.badge,fontSize:11,marginLeft:"auto"}}>{cfg.label}</span>
                </div>
                <div style={{fontSize:12,color:"#94a3b8",marginBottom:10,lineHeight:1.5}}>{r.summary}</div>
                <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
                  {r.items.map(item=>(
                    <span key={item} style={{background:"#0d1117",border:`1px solid ${r.color}33`,color:"#94a3b8",fontSize:11,padding:"3px 9px",borderRadius:4}}>{item}</span>
                  ))}
                </div>
              </div>
            );
          })}
          <div style={{marginTop:8,background:"#161b22",borderRadius:10,padding:14,border:"1px solid #21262d"}}>
            <div style={{fontWeight:700,fontSize:12,marginBottom:8,color:"#94a3b8"}}>About this dashboard</div>
            <div style={{fontSize:11,color:"#64748b",lineHeight:1.6}}>
              This is the live build status of AiMe — a local AI infrastructure project running on personal hardware. Trackers and dashboards run on a private mesh and are not publicly accessible, but the architecture and documentation are open source.<br/><br/>
              <a href="https://github.com/tandrew101/a-i-me" style={{color:"#3b82f6",textDecoration:"none"}}>github.com/tandrew101/a-i-me</a>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<AiMeStatus />);
</script>
</body>
</html>
