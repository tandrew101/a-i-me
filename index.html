            <div style={{color:'#93c5fd',fontWeight:700,marginBottom:8}}>📈 How the build evolved</div>
            <div style={{marginBottom:6}}>
              <span style={{color:'#8a9ab8',fontWeight:600}}>Year one — building without a system: </span>
              <span style={{color:'#64748b'}}>Useful individual outputs — scripts, dashboards, automations — but no shared foundation. Every session started from scratch. Decisions got repeated, names drifted, nothing survived a context reset. A lot of effort for limited compounding.</span>
            </div>
            <div style={{marginBottom:6}}>
              <span style={{color:'#8a9ab8',fontWeight:600}}>The shift — documentation and architecture first: </span>
              <span style={{color:'#64748b'}}>Stopped building randomly, started designing. Master files, session discipline, version control, data privacy policy. Every session now starts from a known state and ends with a committed record. The foundation became the accelerant.</span>
            </div>
            <div>
              <span style={{color:'#93c5fd',fontWeight:600}}>Now — building fast: </span>
              <span style={{color:'#64748b'}}>Each session ships something real. Pieces connect because the design is clear. The documented system is what makes speed possible — not any particular tool.</span>
            </div>
          </div>

          {displayed.map((s,i)=>(
            <div key={i} style={{display:'flex',gap:12,marginBottom:4}}>
              <div style={{display:'flex',flexDirection:'column',alignItems:'center',minWidth:16,paddingTop:6}}>
                <div style={{width:12,height:12,borderRadius:'50%',background:'#f59e0b',border:'2px solid #fbbf24',flexShrink:0}}/>
                {i<displayed.length-1 && <div style={{width:1,background:'#21262d',flex:1,marginTop:3}}/>}
              </div>
              <div style={{flex:1,background:'#161b22',borderRadius:8,padding:'10px 13px',marginBottom:6,border:'1px solid #f59e0b33'}}>
                <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:5}}>
                  <span style={{fontSize:16}}>{s.icon}</span>
                  <span style={{color:'#475569',fontSize:10}}>{s.date}</span>
                </div>
                <div style={{fontSize:13,fontWeight:600,marginBottom:3}}>{s.title}</div>
                <div style={{fontSize:11,color:'#64748b',lineHeight:1.5}}>{s.summary}</div>
              </div>
            </div>
          ))}

          {!showAll && milestones.length > 7 && (
            <div style={{textAlign:'center',marginTop:6}}>
              <button onClick={()=>setShowAll(true)} style={{background:'none',border:'1px solid #21262d',color:'#64748b',padding:'6px 16px',borderRadius:4,cursor:'pointer',fontSize:11,fontFamily:'inherit'}}>
                + {milestones.length - 7} earlier milestones
              </button>
            </div>
          )}
        </div>
      )}

      {/* Tools */}
      {tab==='trackers' && (
        <div>
          <div style={{fontSize:11,color:'#475569',marginBottom:10}}>
            15+ live dashboards and tools on the home server · accessible from anywhere on the private network
          </div>

          <div style={{background:'#0f1a30',border:'1px solid #1d3a6a',borderRadius:8,padding:'12px 16px',marginBottom:14,fontSize:11,color:'#64748b',lineHeight:1.6}}>
            <span style={{color:'#3a7bd5',fontWeight:600}}>🔔 Notifications: </span>
            Installed tools actively monitor for expiry dates, maintenance thresholds, and action-needed triggers — not just display data. Rewards expiry alerts fire daily, tiered by urgency. Vehicle maintenance flags overdue items. Recovery scoring available on demand.
          </div>

          {trackers.filter(t => t.status !== 'wishlist').map(t=>{
            const cfg = t.status==='live'
              ? {bg:'#0f2a1a',bd:'#16a34a',c:'#86efac',label:'Live'}
              : {bg:'#1a1505',bd:'#d97706',c:'#fcd34d',label:'Partial'};
            return (
              <div key={t.name} style={{background:'#161b22',borderRadius:8,padding:'13px 16px',marginBottom:8,border:'1px solid #21262d'}}>
                <div style={{display:'flex',alignItems:'flex-start',gap:12}}>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:4}}>
                      <span style={{background:cfg.bg,color:cfg.c,border:`1px solid ${cfg.bd}`,fontSize:9,fontWeight:600,padding:'1px 6px',borderRadius:3,flexShrink:0}}>{cfg.label}</span>
                      <span style={{fontWeight:600,fontSize:13}}>{t.name}</span>
                    </div>
                    <div style={{fontSize:11,color:'#64748b',lineHeight:1.5,marginBottom:4}}>{t.why}</div>
                    <div style={{fontSize:10,color:'#475569'}}>{t.metric}</div>
                  </div>
                </div>
              </div>
            );
          })}

          <div style={{display:'flex',alignItems:'center',gap:10,margin:'14px 0 10px'}}>
            <div style={{flex:1,height:1,background:'#1e2a3a'}}/>
            <span style={{fontSize:9,color:'#334155',letterSpacing:'2px',textTransform:'uppercase',whiteSpace:'nowrap'}}>Planned</span>
            <div style={{flex:1,height:1,background:'#1e2a3a'}}/>
          </div>

          {trackers.filter(t => t.status === 'wishlist').map(t=>(
            <div key={t.name} style={{background:'#0f1117',borderRadius:8,padding:'11px 14px',marginBottom:6,border:'1px solid #1a2030',opacity:0.7}}>
              <div style={{flex:1,minWidth:0}}>
                <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:3}}>
                  <span style={{background:'#0d1117',color:'#334155',border:'1px solid #1e2a3a',fontSize:9,fontWeight:600,padding:'1px 6px',borderRadius:3,flexShrink:0}}>Planned</span>
                  <span style={{fontWeight:600,fontSize:12,color:'#5a7090'}}>{t.name}</span>
                </div>
                <div style={{fontSize:10,color:'#475569',lineHeight:1.5,marginBottom:t.metric?3:0}}>{t.why}</div>
                {t.metric && <div style={{fontSize:9,color:'#334155'}}>{t.metric}</div>}
              </div>
            </div>
          ))}
        </div>
      )}

      {/* What's Next */}
      {tab==='next' && (
        <div>
          <div style={{fontSize:11,color:'#475569',marginBottom:14}}>4 phases from connected hardware to full personal AI — Phase 1 substantially complete, Phase 2 beginning</div>
          {roadmap.map(r=>{
            const cfg = r.status==='done'
              ? {bg:'#0f2a1a',bd:'#16a34a',badge:'#86efac',label:'✅ Complete'}
              : r.status==='current'
              ? {bg:'#0f1f40',bd:'#3b82f6',badge:'#93c5fd',label:'🔧 In progress'}
              : r.status==='upcoming'
              ? {bg:'#1e1040',bd:'#7c3aed',badge:'#c4b5fd',label:'⬜ Next'}
              : {bg:'#161b22',bd:'#21262d',badge:'#475569',label:'⬜ Future'};
            return (
              <div key={r.phase} style={{background:cfg.bg,border:`1px solid ${cfg.bd}44`,borderLeft:`3px solid ${r.color}`,borderRadius:10,padding:'14px 16px',marginBottom:12}}>
                <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:6,flexWrap:'wrap'}}>
                  <span style={{fontSize:18}}>{r.icon}</span>
                  <span style={{background:'#0d1117',color:r.color,border:`1px solid ${r.color}44`,fontSize:10,fontWeight:700,padding:'2px 8px',borderRadius:4}}>Phase {r.phase}</span>
                  <span style={{fontWeight:700,fontSize:14}}>{r.name}</span>
                  <span style={{color:cfg.badge,fontSize:11,marginLeft:'auto'}}>{cfg.label}</span>
                </div>
                <div style={{fontSize:13,color:'#e2e8f0',fontWeight:600,marginBottom:5}}>{r.headline}</div>
                <div style={{fontSize:11,color:'#94a3b8',marginBottom:10,lineHeight:1.55}}>{r.what}</div>
                <div style={{display:'flex',flexWrap:'wrap',gap:5}}>
                  {r.items.map(item=>(
                    <span key={item} style={{background:'#0d1117',border:`1px solid ${r.color}33`,color:'#94a3b8',fontSize:10,padding:'3px 8px',borderRadius:4}}>{item}</span>
                  ))}
                </div>
              </div>
            );
          })}
        </div>
      )}

      {/* Footer */}
      <div style={{marginTop:20,paddingTop:16,borderTop:'1px solid #21262d',fontSize:11,color:'#64748b',lineHeight:1.6,display:'flex',flexWrap:'wrap',alignItems:'baseline',justifyContent:'space-between',gap:6}}>
        <span><span style={{fontWeight:600,color:'#94a3b8'}}>AiMe</span> — personal AI infrastructure. Open source. No cloud subscription. Built by one person, a few hours at a time. Written with help from Claude.</span>
        <a href="https://github.com/tandrew101/a-i-me" style={{color:'#3b82f6',textDecoration:'none',whiteSpace:'nowrap'}}>github.com/tandrew101/a-i-me</a>
      </div>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<AiMeStatus />);
</script>
<div id="page-ts" style="text-align:right;font-size:10px;color:#475569;font-family:monospace;padding:4px 12px;opacity:0.6"></div>
<script>fetch(window.location.href,{method:'HEAD'}).then(r=>{var lm=r.headers.get('Last-Modified');if(lm)document.getElementById('page-ts').textContent='Deployed: '+new Date(lm).toLocaleString();}).catch(function(){});</script>
</body>
</html>
